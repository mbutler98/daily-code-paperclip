<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Renewal Radar</title>
  <meta name="description" content="What lapses next, and is it close enough to do something about?">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F7F9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1216">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Renewal Radar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="page" id="page">
    <header class="app-bar">
      <h1 class="app-bar__title">Renewal Radar</h1>
      <button class="app-bar__more" id="more" type="button" aria-label="Backup and restore" aria-haspopup="dialog">
        <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="4" cy="10" r="1.6" fill="currentColor"/><circle cx="10" cy="10" r="1.6" fill="currentColor"/><circle cx="16" cy="10" r="1.6" fill="currentColor"/></svg>
      </button>
    </header>
    <div id="radar"></div>
  </main>

  <button class="fab" id="fab" type="button" aria-label="Add an item" aria-haspopup="dialog" hidden>+</button>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite">
    <span class="snackbar__msg" id="snackbar-msg"></span>
    <button class="snackbar__action" id="snackbar-action" type="button" hidden></button>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <!-- Add / Edit / New date -->
  <section class="sheet" id="item-sheet" role="dialog" aria-modal="true" aria-labelledby="item-sheet-title" hidden>
    <div class="sheet__grabber" data-grabber><span></span></div>
    <form class="sheet__form" id="item-form" novalidate autocomplete="off">
      <div class="sheet__body">
        <h2 class="sheet__title" id="item-sheet-title">Add an item</h2>

        <div class="field">
          <label class="field__label" for="f-name">Name</label>
          <input class="input" id="f-name" name="name" type="text" placeholder="Passport" autocapitalize="words" enterkeyhint="next" autocomplete="off" aria-describedby="f-name-err" maxlength="80">
          <p class="field__error" id="f-name-err" hidden>Give it a name</p>
        </div>

        <div class="field">
          <span class="field__label" id="f-cat-label">Category</span>
          <div class="chips" id="f-category" role="radiogroup" aria-labelledby="f-cat-label"></div>
        </div>

        <div class="field">
          <label class="field__label" for="f-expiry">Expires</label>
          <input class="input" id="f-expiry" name="expiry" type="date" aria-describedby="f-expiry-err">
          <p class="field__error" id="f-expiry-err" hidden>When does it expire?</p>
        </div>

        <div class="field field--sentence">
          <label class="sentence" for="f-lead">
            <span>Warn me</span>
            <span class="stepper">
              <button class="stepper__btn" type="button" data-step="-1" aria-label="One day fewer">−</button>
              <input class="stepper__input" id="f-lead" name="leadDays" type="number" inputmode="numeric" min="0" max="365" step="1">
              <button class="stepper__btn" type="button" data-step="1" aria-label="One day more">+</button>
            </span>
            <span>days before</span>
          </label>
        </div>

        <div class="field">
          <label class="field__label" for="f-recur">Renews</label>
          <div class="recur">
            <select class="input" id="f-recur" name="recurrence">
              <option value="none">Doesn't repeat</option>
              <option value="1">Every month</option>
              <option value="12">Every year</option>
              <option value="n">Every N months</option>
            </select>
            <span class="recur__n" id="f-recur-n-wrap" hidden>
              <label for="f-recur-n">Every</label>
              <input class="input input--short" id="f-recur-n" type="number" inputmode="numeric" min="1" max="120" step="1" value="6">
              <span>months</span>
            </span>
          </div>
        </div>

        <div class="field">
          <label class="field__label" for="f-note">Note</label>
          <input class="input" id="f-note" name="note" type="text" placeholder="Optional" autocomplete="off" maxlength="500">
        </div>

        <div class="field">
          <label class="field__label" for="f-cost">Cost</label>
          <input class="input" id="f-cost" name="cost" type="text" inputmode="decimal" placeholder="Optional" autocomplete="off">
        </div>
      </div>
      <div class="sheet__actions">
        <button class="btn btn--secondary" type="button" data-cancel>Cancel</button>
        <button class="btn btn--primary" type="submit">Save</button>
      </div>
    </form>
  </section>

  <!-- Data -->
  <section class="sheet" id="data-sheet" role="dialog" aria-modal="true" aria-labelledby="data-sheet-title" hidden>
    <div class="sheet__grabber" data-grabber><span></span></div>
    <div class="sheet__body">
      <h2 class="sheet__title" id="data-sheet-title">Backup</h2>
      <p class="sheet__text">Your items live only on this phone.</p>
      <div id="data-main" class="stack">
        <button class="btn btn--primary" type="button" id="export">Export backup</button>
        <button class="btn btn--secondary" type="button" id="import">Import backup</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      <div id="data-confirm" class="stack" hidden>
        <p class="sheet__text sheet__text--ink" id="data-confirm-msg"></p>
        <button class="btn btn--primary" type="button" id="import-replace">Replace</button>
        <button class="btn btn--secondary" type="button" id="import-merge">Merge</button>
      </div>
    </div>
    <div class="sheet__actions sheet__actions--single">
      <button class="btn btn--secondary" type="button" data-cancel>Cancel</button>
    </div>
  </section>
</body>
</html>
