<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Code</title>
  <meta name="description" content="Small daily-life projects, one per folder, each built in a day.">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #F6F7F9; --surface: #FFFFFF; --ink: #14181F; --muted: #5A6472; --hairline: #E2E6EB; --accent: #2558D6;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0F1216; --surface: #171C22; --ink: #ECEFF3; --muted: #9AA5B1; --hairline: #262D36; --accent: #7FA6FF; }
    }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { max-width: 640px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 32px) 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 2rem; line-height: 2.25rem; font-weight: 650; }
    .lede { margin: 0 0 24px; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.card {
      display: flex; gap: 16px; align-items: center;
      padding: 16px; border: 1px solid var(--hairline); border-radius: 12px;
      background: var(--surface); color: inherit; text-decoration: none;
    }
    a.card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a.card img { width: 56px; height: 56px; border-radius: 12px; flex: 0 0 auto; }
    .name { display: block; font-size: 1.0625rem; font-weight: 590; }
    .desc { display: block; margin-top: 2px; font-size: .9375rem; color: var(--muted); }
    .date { display: block; margin-top: 4px; font-size: .8125rem; color: var(--muted); }
    footer { margin-top: 32px; font-size: .8125rem; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Daily Code</h1>
    <p class="lede">Small daily-life projects, each built in a day.</p>
    <ul>
      <li>
        <a class="card" href="renewal-radar/">
          <img src="renewal-radar/apple-touch-icon.png" alt="">
          <span>
            <span class="name">Renewal Radar</span>
            <span class="desc">What lapses next, and is it close enough to do something about? Passports, insurance, registrations, free trials.</span>
            <span class="date">16 Oct 2026</span>
          </span>
        </a>
      </li>
    </ul>
    <footer><a href="https://github.com/mbutler98/daily-code-paperclip">Source on GitHub</a></footer>
  </main>
</body>
</html>
